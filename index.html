<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rare Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* Layout: pixel fishing stage on top (the hook keeps sinking as your score grows), one chunky pixel panel below. Single deliberate night-lake look. */
:root {
  --night: #0b1424;
  --panel: #14243a;
  --panel-2: #1c3150;
  --edge: #050912;
  --hi: #2b4870;
  --shade: #0c1729;
  --cream: #f4ead2;
  --muted: #9fb3c8;
  --accent: #ffb02e;
  --accent-d: #b86f00;
  --worm: #ff7aa2;
  --bad: #ff5f6d;
  /* Answer depth follows the usual game rarity ladder: gray, green, blue, purple, orange, gold. */
  --t1: #b8c2cc; --t2: #5fd068; --t3: #4aa3ff; --t4: #b06bff; --t5: #ff9a3c; --t6: #ffd23f;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--night);
  background-image: radial-gradient(var(--panel) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--cream);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--pixel); font-size: 22px; letter-spacing: 1px; margin: 0; color: var(--cream); text-shadow: 3px 3px 0 var(--edge); }
.logo span { color: var(--accent); }
.topright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stat { font-family: var(--pixel); font-size: 10px; color: var(--muted); }

.box {
  background: var(--panel);
  border: 4px solid var(--edge);
  box-shadow: inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--shade), 4px 4px 0 var(--edge);
  padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.stage { position: relative; border: 4px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); background: var(--edge); }
#sea { display: block; width: 100%; height: auto; aspect-ratio: 320 / 200; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; justify-content: space-between; gap: 8px; font-family: var(--pixel); font-size: 10px; pointer-events: none; }
.hud span { background: rgba(5, 9, 18, .72); padding: 6px 8px; }
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--pixel); font-size: 16px; text-shadow: 3px 3px 0 var(--edge); pointer-events: none; white-space: nowrap; opacity: 0; }
.toast.show { animation: toast 1.6s steps(8) forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20%); } 15% { opacity: 1; transform: translate(-50%, -50%); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }

h2 { font-family: var(--body); font-weight: 700; font-size: 1.6rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-family: var(--pixel); font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }

.btn {
  font-family: var(--pixel); font-size: 11px; line-height: 1.3; letter-spacing: .5px;
  padding: 13px 14px; cursor: pointer; color: var(--edge);
  background: var(--accent); border: 4px solid var(--edge);
  box-shadow: inset -4px -4px 0 var(--accent-d), inset 4px 4px 0 #ffd889;
}
.btn.alt { background: var(--panel-2); color: var(--cream); box-shadow: inset -4px -4px 0 var(--shade), inset 4px 4px 0 var(--hi); }
.btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, input:focus-visible, .sugg li:focus-visible { outline: 3px solid var(--t2); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.pips { display: flex; gap: 6px; }
.pips i { flex: 1; height: 10px; background: var(--shade); border: 2px solid var(--edge); }
.pips i.done { background: var(--muted); }
.pips i.now { background: var(--accent); }

.cast { position: relative; display: flex; gap: 10px; flex-wrap: wrap; }
.field { position: relative; flex: 1 1 240px; min-width: 0; }
.field input {
  width: 100%; font: 400 1.2rem var(--body); padding: 12px 14px; color: var(--cream);
  background: var(--edge); border: 4px solid var(--edge); box-shadow: inset 4px 4px 0 #000, inset -2px -2px 0 var(--hi);
}
.field.shake { animation: shake .3s steps(6); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.clock { font-family: var(--pixel); font-size: 16px; color: var(--cream); font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .4; } }
.timebar { height: 12px; background: var(--edge); border: 2px solid var(--edge); }
.timebar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .2s linear; }
.timebar i.low { background: var(--bad); }
.feedback { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 1.5em; }
.feedback .nope { color: var(--bad); }
.feedback .btn { font-size: 10px; padding: 9px 10px; }

.result { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.answer { font-family: var(--pixel); font-size: 13px; padding: 10px 12px; background: var(--edge); }
.tierbadge { font-family: var(--pixel); font-size: 11px; padding: 8px 10px; color: var(--edge); }

.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 520px) { .tiers { grid-template-columns: repeat(2, 1fr); } }
.tier { background: var(--edge); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.tier b { font-family: var(--pixel); font-size: 14px; }
.tier small { font-family: var(--pixel); font-size: 8px; color: var(--muted); letter-spacing: .5px; }
.rules { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }

.catch { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; }
@media (max-width: 480px) { .catch { grid-template-columns: 1fr; } }
.catch canvas { width: 140px; height: auto; image-rendering: pixelated; background: var(--edge); }
.catch h2 { font-size: 1.8rem; }
.rar { font-family: var(--pixel); font-size: 10px; padding: 6px 8px; color: var(--edge); display: inline-block; }
.new { font-family: var(--pixel); font-size: 9px; color: var(--worm); margin-left: 8px; }

.recap { display: flex; flex-direction: column; }
.recap div { display: flex; justify-content: space-between; gap: 12px; padding-block: 7px; border-bottom: 2px dashed var(--hi); }
.recap span { min-width: 0; }
.recap b { font-family: var(--pixel); font-size: 11px; white-space: nowrap; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.fishcard { background: var(--edge); padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border: 2px solid transparent; }
.fishcard.on { border-color: var(--accent); }
.fishcard canvas { width: 100%; height: auto; image-rendering: pixelated; }
.fishcard .nm { font-weight: 700; line-height: 1.1; }
.fishcard .btn { font-size: 9px; padding: 8px 9px; }
.odds { width: 100%; border-collapse: collapse; font-size: .95rem; }
.odds th, .odds td { text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--shade); vertical-align: top; }
.odds th { font-family: var(--pixel); font-size: 9px; color: var(--muted); font-weight: 400; }
.tablewrap { overflow-x: auto; }
.note { font-size: .95rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast.show { animation: none; opacity: 1; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">RARE<span>CATCH</span></h1>
    <div class="topright">
      <span class="stat" id="best"></span>
      <button class="btn alt" id="tackle" type="button">TACKLE BOX</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="sea" width="320" height="200" aria-label="Pixel lake with your fishing line"></canvas>
    <div class="hud"><span id="hudL">DEPTH 0 FT</span><span id="hudR"></span></div>
    <div class="toast" id="toast"></div>
  </div>
  <section class="box" id="panel"></section>
</div>

const OUTLINE = "#050912";
function buildSprite(f, silhouette) {
  const rows = TEMPLATES[f.shape];
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < (rows[y] || "").length && rows[y][x] !== ".";
  const mid = Math.floor(h / 2);
  const pat = (x, y) => ({
    vstripe: x % 4 === 1 && x > 2,
    hstripe: y === mid,
    spots: (x * 7 + y * 3) % 5 === 0,
    band: x >= Math.floor(w * .3) && x <= Math.floor(w * .42),
    glow: (x * 5 + y * 11) % 9 === 0,
    none: false,
  })[f.pattern];
  const c = document.createElement("canvas");
  c.width = w + 2; c.height = h + 2;
  const g = c.getContext("2d");
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    let col = null;
    if (filled(x, y)) {
      const ch = rows[y][x];
      if (silhouette) col = "#0e1a2c";
      else col = ch === "B" ? (pat(x, y) ? f.accent : f.body)
        : ch === "b" ? f.belly : ch === "F" ? f.fin : ch === "E" ? OUTLINE : ch === "W" ? "#ffffff" : f.accent;
    } else if (filled(x-1,y) || filled(x+1,y) || filled(x,y-1) || filled(x,y+1)) {
      col = silhouette ? "#2b4870" : OUTLINE;
    }
    if (col) { g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1); }
  }
  return { c, w: w + 2, h: h + 2, mid: mid + 1 };
}

const BANDS = [0, 120, 240, 360, 460, 560];
const bandFor = s => BANDS.reduce((b, min, i) => s >= min ? i : b, 0);
function odds(b) {
  const o = {}; const add = (r, p) => o[r] = +((o[r] || 0) + p).toFixed(2);
  if (b === 5) { add(6, .5); add(4, 5); add(5, 94.5); }
  else { add(Math.min(b + 2, 5), 1); add(b + 1, 5); if (b > 0) { add(b - 1, 5); add(b, 89); } else add(b, 94); }
  return o;
}
function rollFish(score) {
  const o = odds(bandFor(score));
  let r = Math.random() * 100, rarity = bandFor(score);
  for (const k of Object.keys(o).map(Number).sort((a, b) => b - a)) { r -= o[k]; if (r < 0) { rarity = k; break; } }
  const pool = FISH.filter(f => f.rarity === rarity);
  return pool[Math.floor(Math.random() * pool.length)];
}

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/&/g, "and").replace(/\+/g, "plus").replace(/#/g, "sharp").replace(/^(the|a|an) /, "").replace(/[^a-z0-9]/g, "");

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

// Exact match only (ignoring case, accents, spaces, "the" and plurals). Near misses go through nearby().
function match(question, guess) {
  const g = norm(guess);
  if (!g) return null;
  const variants = new Set([g, g.replace(/s$/, ""), g.replace(/es$/, ""), g + "s"]);
  for (const a of question.answers) if (a.keys.some(k => variants.has(k))) return a;
  return null;
}

// "Did you mean" choices, drawn only from answers this prompt accepts.
function nearby(question, guess) {
  const g = norm(guess);
  if (!g) return [];
  const found = [];
  for (const a of question.answers) {
    let best = Infinity;
    for (const k of a.keys) {
      const limit = k.length >= 8 ? 3 : k.length >= 5 ? 2 : k.length >= 3 ? 1 : 0;
      const d = lev(g, k);
      if (d <= limit) best = Math.min(best, d);
      else if (g.length >= 3 && k.startsWith(g)) best = Math.min(best, limit + .5);
    }
    if (best < Infinity) found.push([best, a]);
  }
  return found.sort((x, y) => x[0] - y[0]).slice(0, 3).map(x => x[1]);
}

function hookScore(now) { return scene.from + (scene.to - scene.from) * ease((now - scene.t0) / 1400); }
function sinkTo(score) { scene.from = hookScore(performance.now()); scene.to = score; scene.t0 = performance.now(); }

function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function pline(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;

}
function drawSprite(sp, x, y, scale = 1) { ctx.drawImage(sp.c, Math.round(x), Math.round(y), sp.w * scale, sp.h * scale); }

function draw(now) {
  const t = now / 1000;
  const hs = hookScore(now);

  scene.cam += (target - scene.cam) * 0.08;
  const cam = Math.round(scene.cam);

  for (let i = 0; i < 18; i++) if ((i * 37 + Math.floor(t * 2)) % 7) px((i * 53) % W, Y((i * 17) % 18 + 2), 1, 1, "#f4ead2");
  // Sun sinking into the lake
  for (let r = 0; r < 12; r++) { const half = Math.round(Math.sqrt(144 - r * r)); px(262 - half, Y(SURF - r - 1), half * 2, 1, r > 8 ? "#ffd27a" : "#ffb85c"); }
  // Clouds
  [[30, 10, 26], [96, 18, 18], [230, 8, 22]].forEach(([x, y, w], i) => {
    const cx = (x + t * (2 + i)) % (W + 40) - 30;
    px(cx, Y(y), w, 3, "#c9a2c8"); px(cx + 4, Y(y - 2), w - 10, 2, "#e0bcd4");
  });

  // Water zones, one per fish-rarity band
  for (let i = 0; i < 6; i++) {
    const top = i === 0 ? SURF : depthY(BANDS[i]);
    const bottom = i === 5 ? WORLD_H + 10 : depthY(BANDS[i + 1]);
    px(0, Y(top), W, bottom - top + 1, ZONE_WATER[i]);
    // Dithered seam into the next zone
    if (i < 5) for (let x = 0; x < W; x += 2) { px(x + ((x / 2) % 2), Y(bottom - 2), 1, 1, ZONE_WATER[i + 1]); px(x, Y(bottom - 1), 1, 1, ZONE_WATER[i + 1]); }
    if (i > 0) {
      ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign = "right";
      ctx.fillStyle = OUTLINE; ctx.fillText(`${RARITY[i].name.toUpperCase()} ${BANDS[i]}`, W - 5, Y(top) + 13);
      ctx.fillStyle = RARITY[i].color; ctx.fillText(`${RARITY[i].name.toUpperCase()} ${BANDS[i]}`, W - 6, Y(top) + 12);
    }
  }
  ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign = "right";
  ctx.fillStyle = OUTLINE; ctx.fillText("COMMON 0", W - 5, Y(SURF) + 21);
  ctx.fillStyle = RARITY[0].color; ctx.fillText("COMMON 0", W - 6, Y(SURF) + 20);

  // Light shafts near the surface
  ctx.globalAlpha = .08;
  for (let i = 0; i < 4; i++) { const x = 30 + i * 70 + Math.sin(t * .5 + i) * 6; for (let y = 0; y < 90; y += 2) px(x + y * .4, Y(SURF + y), 10, 2, "#ffffff"); }
  ctx.globalAlpha = 1;

  // Surface ripples
  for (let x = 0; x < W; x += 6) px(x + Math.round(Math.sin(t * 2 + x * .1) * 2), Y(SURF), 4, 1, ZONE_WATER_HI[0]);
  px(0, Y(SURF), W, 1, "#7fd3e6");

  // Background fish silhouettes
  ctx.globalAlpha = .28;
  scene.ambient.forEach(a => {
    a.x += a.v; if (a.x < -12) a.x = W + 12; if (a.x > W + 12) a.x = -12;
    const s = a.s;
    px(a.x, Y(a.y), 6 * s, 2 * s, OUTLINE); px(a.x + (a.v > 0 ? -2 * s : 6 * s), Y(a.y) - s, 2 * s, 4 * s, OUTLINE);
  });
  ctx.globalAlpha = 1;

  // Boat and angler at the surface
  const bob = Math.round(Math.sin(t * 1.6));
  const by = Y(SURF) + bob;
  px(136, by - 6, 56, 4, "#8a5634"); px(140, by - 2, 48, 3, "#6b3e26"); px(146, by + 1, 36, 2, "#4a2a1a");
  px(136, by - 7, 56, 1, "#c98a5a");
  px(170, by - 16, 6, 9, "#3b6fb6"); px(170, by - 22, 6, 6, "#f1c27d"); px(169, by - 24, 8, 2, "#d94f3d"); px(176, by - 23, 3, 1, "#d94f3d");
  pline(176, by - 12, HOOKX, Y(TIPY) + bob, "#d9a066");
  pline(177, by - 12, HOOKX + 1, Y(TIPY) + bob, "#a8743f");
  px(177, by - 12, 3, 3, "#555");

  // Fishing line and hook
  const hy = Y(hookY);
  pline(HOOKX, Y(TIPY) + bob, HOOKX, hy, "#e8eef0");
  px(HOOKX - 1, Y(SURF) - 3, 3, 3, "#ff6f4f"); px(HOOKX - 1, Y(SURF), 3, 1, "#f4ead2");
  // Hook
  px(HOOKX, hy, 1, 6, "#c9d1d9"); px(HOOKX + 1, hy + 6, 2, 1, "#c9d1d9"); px(HOOKX + 3, hy + 3, 1, 3, "#c9d1d9"); px(HOOKX + 3, hy + 2, 1, 1, "#ffffff");
  // Worm
  if (scene.worm) {
    const wg = Math.round(Math.sin(t * 6));
    px(HOOKX - 2, hy + 4 + wg, 2, 2, "#ff7aa2"); px(HOOKX + 1, hy + 7, 3, 2, "#ff7aa2"); px(HOOKX + 4, hy + 5 - wg, 2, 2, "#ff7aa2"); px(HOOKX - 3, hy + 6 + wg, 1, 2, "#e0567f");
  }
  // Bubbles
  if (Math.random() < .06) scene.bubbles.push({ x: HOOKX + 2 + Math.random() * 6, y: hookY, life: 0 });
  scene.bubbles = scene.bubbles.filter(b => b.y > SURF + 2 && b.life < 400);
  scene.bubbles.forEach(b => { b.y -= .5; b.life++; b.x += Math.sin(b.life * .1) * .2; px(b.x, Y(b.y), 2, 2, "#bfe8f5"); px(b.x, Y(b.y), 1, 1, "#ffffff"); });

  // Your equipped fish swims beside the hook
  const buddy = SPRITES[equipped];
  if (buddy && !scene.catchFish) drawSprite(buddy, HOOKX + 12 + Math.sin(t * 1.3) * 4, hy - buddy.mid + Math.sin(t * 2.1) * 2);

  // Catch sequence: the fish swims in and bites the worm
  if (scene.catchFish) {
    const sp = SPRITES[scene.catchFish.id];
    const scale = scene.catchFish.rarity >= 5 ? 2 : 1;
    const p = (now - scene.catchT0) / 1800;
    const x = W + 10 + (HOOKX + 1 - W - 10) * ease(p);
    const shake = p > 1 && p < 1.35 ? Math.round(Math.sin(now / 25)) : 0;
    if (scene.catchFish.rarity >= 4) {
      ctx.globalAlpha = .25 + .1 * Math.sin(t * 4); ctx.fillStyle = scene.catchFish.accent;
      ctx.fillRect(Math.round(x) - 4, hy - sp.mid * scale - 4, sp.w * scale + 8, sp.h * scale + 8); ctx.globalAlpha = 1;
    }
    drawSprite(sp, x + shake, hy + 5 - sp.mid * scale, scale);
    if (p > 1) {
      scene.worm = false;
      const k = Math.floor((now - scene.catchT0 - 1800) / 90);
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, r = 8 + (k % 6) * 2; px(HOOKX + Math.cos(a) * r, hy + 5 + Math.sin(a) * r, 2, 2, i % 2 ? "#ffd84d" : "#ffffff"); }
      ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign = "center";
      ctx.fillStyle = OUTLINE; ctx.fillText("CHOMP!", HOOKX + 1, hy - 17); ctx.fillStyle = "#ffd84d"; ctx.fillText("CHOMP!", HOOKX, hy - 18);
    }
    if (p > 1.8 && scene.catchDone) { const cb = scene.catchDone; scene.catchDone = null; cb(); }
  }

  document.getElementById("hudL").textContent = `DEPTH ${Math.round(hs)} FT`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ===================== UI =====================
const panel = document.getElementById("panel");
const hudR = document.getElementById("hudR");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(rand) {
  const idx = QUESTIONS.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, PER_GAME);
}
let game = null;

function showBest() { document.getElementById("best").textContent = `BEST ${store.get("rc3-best", 0)}/${MAX}`; }
function toast(text, color) {
  const el = document.getElementById("toast");
  el.textContent = text; el.style.color = color; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
function fishCanvas(f, silhouette, scale = 6) {
  const sp = (silhouette ? SILHOUETTES : SPRITES)[f.id];
  const c = document.createElement("canvas");
  c.width = 30 * scale; c.height = 14 * scale;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  const s = Math.min(scale, Math.floor((c.width - 8) / sp.w), Math.floor((c.height - 4) / sp.h));
  g.drawImage(sp.c, Math.round((c.width - sp.w * s) / 2), Math.round((c.height - sp.h * s) / 2), sp.w * s, sp.h * s);
  return c;
}

function home() {
  stopTimer(); game = null; resetHook(); scene.worm = true; hudR.textContent = "";
  const played = store.get("rc3-daily", "") === today();
  panel.innerHTML = `
    <h2>Cast for the answer nobody else will think of.</h2>
    <ul class="rules">
      <li>${PER_GAME} prompts, ${LIMIT} seconds each. Only answers on the list count, so keep guessing until one lands.</li>
      <li>Rarer correct answers score more. Your hook sinks deeper with every point and stays there.</li>
      <li>At the end, a fish bites the worm. The deeper you are, the rarer the fish.</li>
      <li>Collect fish in your tackle box and equip one to swim beside your hook.</li>
    </ul>
    <div class="tiers">${[1,2,3,4,5,6].map(t => `<div class="tier"><small>${TIERS[t].name.toUpperCase()}</small><b style="color:${TIERS[t].color}">+${POINTS[t]}</b></div>`).join("")}</div>
    <div class="row">
      <button class="btn" id="daily" type="button">${played ? "REPLAY TODAY" : "TODAY'S TRIP"}</button>
      <button class="btn alt" id="random" type="button">RANDOM TRIP</button>
    </div>
    <p class="note">Today's trip uses the same ${PER_GAME} prompts for everyone on ${today()}, so your class can compare scores. ${QUESTIONS.length} prompts in the bank. Only one answer per prompt reaches the Trench.</p>`;
  document.getElementById("daily").onclick = () => start(true);
  document.getElementById("random").onclick = () => start(false);
}

function start(daily) {
  const seed = daily ? +today().replace(/-/g, "") : Math.floor(Math.random() * 1e9);
  game = { daily, qs: pick(rng(seed)), i: 0, picks: [], score: 0 };
  resetHook(); scene.worm = true;
  ask();
}
const pips = () => `<div class="pips">${game.qs.map((_, i) => `<i class="${i < game.i ? "done" : i === game.i ? "now" : ""}"></i>`).join("")}</div>`;

const LIMIT = 30;
let timer = null;
const stopTimer = () => { clearInterval(timer); timer = null; };

function ask() {
  stopTimer();
  const q = QUESTIONS[game.qs[game.i]];
  hudR.textContent = `SCORE ${game.score}`;
  panel.innerHTML = `
    ${pips()}
    <div class="qhead"><div class="label">Cast ${game.i + 1} of ${PER_GAME}</div><div class="clock" id="clock">0:${LIMIT}</div></div>
    <div class="timebar"><i id="timefill"></i></div>
    <h2>${esc(q.q)}</h2>
    <form class="cast" id="f" autocomplete="off">
      <div class="field" id="field">
        <input type="text" id="guess" placeholder="Type your answer" aria-label="Your answer" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" type="submit">CAST</button>
    </form>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <p class="note">Only answers on the list count. Keep trying until the clock runs out.</p>`;
  const input = document.getElementById("guess");
  const field = document.getElementById("field");
  const fb = document.getElementById("feedback");
  const clock = document.getElementById("clock");
  const fill = document.getElementById("timefill");
  const end = performance.now() + LIMIT * 1000;
  const tick = () => {
    const left = Math.max(0, (end - performance.now()) / 1000);
    clock.textContent = `0:${String(Math.ceil(left)).padStart(2, "0")}`;
    fill.style.width = `${left / LIMIT * 100}%`;
    clock.classList.toggle("low", left <= 10);
    fill.classList.toggle("low", left <= 10);
    if (left <= 0) { stopTimer(); reveal(null, true); }
  };
  tick();
  timer = setInterval(tick, 200);
  input.focus();
  input.addEventListener("input", () => { fb.innerHTML = ""; });
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v || !timer) return;
    const ans = match(q, v);
    if (ans) { stopTimer(); reveal(ans); return; }
    const near = nearby(q, v);
    if (near.length) {
      fb.innerHTML = `<span>Did you mean</span>${near.map((a, i) => `<button class="btn alt" type="button" data-i="${i}">${esc(a.label).toUpperCase()}</button>`).join("")}`;
      fb.querySelectorAll("button").forEach(b => b.onclick = () => { if (!timer) return; stopTimer(); reveal(near[+b.dataset.i]); });
    } else {
      fb.innerHTML = `<span class="nope">"${esc(v)}" isn't on the list. Try again.</span>`;
      field.classList.remove("shake"); void field.offsetWidth; field.classList.add("shake");
      input.select();
    }
  };
}

function reveal(ans, timedOut) {
  const q = QUESTIONS[game.qs[game.i]];
  const pts = ans ? POINTS[ans.tier] : 0;
  game.picks.push({ q: q.q, ans, pts });
  game.score += pts;
  hudR.textContent = `SCORE ${game.score}`;
  if (pts) { sinkTo(game.score); toast(`+${pts} ${TIERS[ans.tier].name.toUpperCase()}`, getComputedStyle(document.documentElement).getPropertyValue(`--t${ans.tier}`)); }
  else toast("TIME'S UP", "#ff5f6d");
  const last = game.i === PER_GAME - 1;
  panel.innerHTML = `
    ${pips()}
    <div class="label">Cast ${game.i + 1} of ${PER_GAME}</div>
    <h2>${esc(q.q)}</h2>
    <div class="result">
      ${ans
        ? `<span class="answer">${esc(ans.label).toUpperCase()}</span><span class="tierbadge" style="background:${TIERS[ans.tier].color}">${TIERS[ans.tier].name.toUpperCase()} +${pts}</span>`
        : `<span class="tierbadge" style="background:var(--bad)">TIME'S UP +0</span>`}
    </div>
    <p class="muted">${ans ? `Your hook sank to ${game.score} ft.` : "Your hook stays where it was."} ${ans && ans.tier === 6 ? "That's the single rarest answer for this prompt." : ""}</p>
    <div class="row"><button class="btn" id="next" type="button">${last ? "WAIT FOR A BITE" : "NEXT CAST"}</button></div>`;
  const next = document.getElementById("next");
  next.focus();
  next.onclick = () => { game.i++; last ? finish() : ask(); };
}

function finish() {
  const score = game.score, band = bandFor(score);
  if (score > store.get("rc3-best", 0)) store.set("rc3-best", score);
  if (game.daily) store.set("rc3-daily", today());
  showBest();
  const fish = rollFish(score);
  const isNew = !collection[fish.id];
  collection[fish.id] = (collection[fish.id] || 0) + 1;
  store.set("rc3-collection", collection);
  panel.innerHTML = `
    <div class="label">Final depth ${score} ft · ${RARITY[band].name} waters</div>
    <h2>Something is circling the worm...</h2>`;
  scene.worm = true;
  scene.catchFish = fish; scene.catchT0 = performance.now();
  scene.catchDone = () => showCatch(fish, isNew, score, band);
}

function showCatch(fish, isNew, score, band) {
  const r = RARITY[fish.rarity];
  const squares = game.picks.map(p => p.ans ? ["","⬜","🟩","🟦","🟪","🟧","🟨"][p.ans.tier] : "⬛").join("");
  const share = `Rare Catch ${game.daily ? today() : "(random)"}: ${score}/${MAX}\n${squares}\nCaught: ${fish.name} (${r.name})`;
  panel.innerHTML = `
    <div class="catch">
      <div id="catchArt"></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <div class="label">You caught</div>
        <h2>${esc(fish.name)}</h2>
        <div><span class="rar" style="background:${r.color}">${r.name.toUpperCase()}</span>${isNew ? `<span class="new">NEW!</span>` : `<span class="new" style="color:var(--muted)">x${collection[fish.id]}</span>`}</div>
        <p class="note">Score ${score}/${MAX} put you in ${RARITY[band].name.toLowerCase()} waters.</p>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="equip" type="button">${equipped === fish.id ? "EQUIPPED" : "EQUIP AS SKIN"}</button>
      <button class="btn alt" id="copy" type="button">COPY SCORE</button>
    </div>
    <p class="note" id="copied" hidden></p>
    <div class="recap">${game.picks.map(p => `<div><span>${esc(p.q)}<br><span style="color:${p.ans ? TIERS[p.ans.tier].color : "var(--bad)"}">${p.ans ? esc(p.ans.label) + " · " + TIERS[p.ans.tier].name : "Time's up"}</span></span><b>+${p.pts}</b></div>`).join("")}</div>
    <div class="row">
      <button class="btn" id="again" type="button">RANDOM TRIP</button>
      <button class="btn alt" id="box" type="button">TACKLE BOX</button>
      <button class="btn alt" id="home" type="button">MENU</button>
    </div>`;
  document.getElementById("catchArt").appendChild(fishCanvas(fish, false));
  const eq = document.getElementById("equip");
  eq.onclick = () => { equip(fish.id); eq.textContent = "EQUIPPED"; };
  document.getElementById("copy").onclick = () => {
    const c = document.getElementById("copied");
    navigator.clipboard.writeText(share).then(() => { c.hidden = false; c.textContent = "Copied. Paste it to your friends."; })
      .catch(() => { c.hidden = false; c.textContent = share; });
  };
  document.getElementById("again").onclick = () => start(false);
  document.getElementById("box").onclick = tackleBox;
  document.getElementById("home").onclick = home;
}

function equip(id) { equipped = id; store.set("rc3-equipped", id); }

function tackleBox() {
  stopTimer(); game = null; resetHook(); scene.worm = true; hudR.textContent = "";
  const caught = FISH.filter(f => collection[f.id]).length;
  panel.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2>Tackle box</h2>
      <span class="label">${caught} / ${FISH.length} caught</span>
    </div>
    <p class="muted">Tap a fish you've caught to equip it. It swims next to your hook while you play.</p>
    <div class="grid" id="grid"></div>
    <h2 style="font-size:1.3rem">Bite odds</h2>
    <div class="tablewrap"><table class="odds">
      <thead><tr><th>FINAL SCORE</th><th>WHAT BITES</th></tr></thead>
      <tbody>${BANDS.map((min, b) => {
        const max = b < 5 ? BANDS[b + 1] - 1 : MAX;
        const o = odds(b);
        const parts = Object.keys(o).map(Number).sort((a, c) => o[c] - o[a]).map(k => `<span style="color:${RARITY[k].color}">${RARITY[k].name} ${o[k]}%</span>`).join(", ");
        return `<tr><td>${min}–${max}</td><td>${parts}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
    <div class="row"><button class="btn" id="home" type="button">BACK</button></div>`;
  const grid = document.getElementById("grid");
  FISH.forEach(f => {
    const have = !!collection[f.id];
    const card = document.createElement("div");
    card.className = "fishcard" + (equipped === f.id ? " on" : "");
    card.appendChild(fishCanvas(f, !have, 4));
    const r = RARITY[f.rarity];
    card.insertAdjacentHTML("beforeend", `
      <span class="nm">${have ? esc(f.name) : "???"}</span>
      <span class="rar" style="background:${r.color}">${r.name.toUpperCase()}</span>
      ${have ? `<button class="btn ${equipped === f.id ? "" : "alt"}" type="button">${equipped === f.id ? "EQUIPPED" : "EQUIP"} ${collection[f.id] > 1 ? "x" + collection[f.id] : ""}</button>` : `<span class="note">Not caught yet</span>`}`);
    const b = card.querySelector("button");
    if (b) b.onclick = () => { equip(f.id); tackleBox(); };
    grid.appendChild(card);
  });
  document.getElementById("home").onclick = home;
}

document.getElementById("tackle").onclick = tackleBox;
showBest();
home();
</script>
